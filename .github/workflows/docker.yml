# Build and publish the Xalgorix container image.
#
# Triggers on version tags (vX.Y.Z, pushed by release.sh) and can be run
# manually. Publishes the purpose-built amd64 image tagged with the
# version and `latest` to:
#   - GitHub Container Registry: ghcr.io/xalgord/xalgorix   (always)
#   - Docker Hub:                docker.io/xalgord/xalgorix (when the
#     DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets are set)
#
# The Docker Hub target is OPTIONAL and self-gating: with no secrets, the run
# still succeeds and publishes to GHCR only. (Release binaries remain
# multi-arch via the installer.)
name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Surfaced so steps can gate the Docker Hub path on the secret being set.
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scanner build caches are larger than the final runtime. Reclaim unused
      # hosted-runner SDKs without pruning Docker images or volumes.
      - name: Free hosted runner SDK space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: only runs when the Docker Hub secrets are configured.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR always; Docker Hub (docker.io/xalgord/xalgorix) only when the
          # secret is present — the empty line is ignored by the action.
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_USER != '' && 'docker.io/xalgord/xalgorix' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build amd64 validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xalgorix:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version || github.ref_name }}

      - name: Verify scanner runtime
        run: docker run --rm --network none --entrypoint python3 xalgorix:ci /usr/local/share/xalgorix/smoke-test.py

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The published platform is validated above before pushing.
          # Native arm64 source builds are supported separately.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || github.ref_name }}
