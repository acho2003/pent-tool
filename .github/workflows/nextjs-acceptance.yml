name: Next.js source and framework acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/scanner/**'
      - 'internal/assessment/**'
      - 'test/nextjs-lab/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/nextjs-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: nextjs-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: test/nextjs-lab/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the runtime-pinned Semgrep engine
        run: python -m pip install --disable-pip-version-check 'semgrep==1.178.0'
      - name: Exercise offline source rules and negative controls
        env:
          CGO_ENABLED: '0'
          XALGORIX_TEST_SEMGREP: semgrep
        run: go test ./internal/scanner -run '^TestNextjsSAST' -count=1
      - name: Build owned loopback-only framework counterparts and gate the matrix
        run: python test/nextjs-lab/run.py --browser "$(command -v google-chrome)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextjs-framework-scorecard
          path: test/nextjs-lab/lab-results.json
          if-no-files-found: warn
