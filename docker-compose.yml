include:
  - compose.greenbone.yaml

services:
  xalgorix:
    # Build the checked-out source instead of pulling the historical amd64-only
    # release image. This lets Docker Desktop produce a native arm64 image on
    # Apple Silicon while retaining the same service name for deployments.
    build:
      context: .
      dockerfile: Dockerfile
    image: xalgorix:local
    pull_policy: build
    privileged: true
    ports:
      - "127.0.0.1:9137:9137"
    volumes:
      - xalgorix-data:/data
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro
      - gvmd_socket_vol:/run/gvmd:ro
    environment:
      XALGORIX_ZAP_URL: http://zap:8080
      XALGORIX_ZAP_API_KEY: ${XALGORIX_ZAP_API_KEY:-xalgorix-internal-zap}
      XALGORIX_GVM_SOCKET: /run/gvmd/gvmd.sock
      XALGORIX_GVM_USERNAME: ${XALGORIX_GVM_USERNAME:-admin}
      XALGORIX_GVM_PASSWORD: ${XALGORIX_GVM_PASSWORD:-admin}
    depends_on:
      zap:
        condition: service_healthy
      gvmd:
        condition: service_started
      ospd-openvas:
        condition: service_started
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.key=${XALGORIX_ZAP_API_KEY:-xalgorix-internal-zap}
    # No shared volume: the engine drives ZAP entirely over its HTTP API and
    # pulls the JSON report back through it, so ZAP never reads or writes the
    # scan directory.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/JSON/core/view/version/?apikey=${XALGORIX_ZAP_API_KEY:-xalgorix-internal-zap}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  xalgorix-data:
